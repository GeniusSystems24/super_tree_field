name: super_tree_field_example
description: Runnable gallery for the super_tree_field Flutter package.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_syntax_view: ^4.1.7
  # Shared GeniusLink foundation (transitive via the package; listed for resolution).
  super_core: ">=3.3.0 <4.0.0"
  super_form_field: ">=1.8.2 <2.0.0"
  super_tree_field:
    path: ../

dev_dependencies:
  intl_utils: ^2.8.14
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # The following section is specific to Flutter.
  generate: true # Add this line
